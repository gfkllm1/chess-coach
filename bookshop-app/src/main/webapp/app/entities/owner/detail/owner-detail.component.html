<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (owner(); as ownerRef) {
      <div>
        <h2 data-cy="ownerDetailsHeading"><span jhiTranslate="bookshopApp.owner.detail.title">Owner</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="bookshopApp.owner.id">Id</span></dt>
          <dd>
            <span>{{ ownerRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="bookshopApp.owner.firstname">Firstname</span></dt>
          <dd>
            <span>{{ ownerRef.firstname }}</span>
          </dd>
          <dt><span jhiTranslate="bookshopApp.owner.surname">Surname</span></dt>
          <dd>
            <span>{{ ownerRef.surname }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/owner', ownerRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
