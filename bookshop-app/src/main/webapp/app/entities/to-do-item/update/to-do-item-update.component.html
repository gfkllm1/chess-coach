<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-to-do-item-heading" data-cy="ToDoItemCreateUpdateHeading" jhiTranslate="bookshopApp.toDoItem.home.createOrEditLabel">
        Create or edit a To Do Item
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        @if (editForm.controls.id.value !== null) {
          @let idRef = editForm.get('id')!;
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="bookshopApp.toDoItem.id">Id</label>
            <input type="text" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
            @if (idRef.invalid && (idRef.dirty || idRef.touched)) {
              <div>
                @if (editForm.get('id')?.errors?.required) {
                  <small class="form-text text-danger" jhiTranslate="entity.validation.required">This field is required.</small>
                }
              </div>
            }
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_description" jhiTranslate="bookshopApp.toDoItem.description">Description</label>
          <input
            type="text"
            class="form-control"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_duedate" jhiTranslate="bookshopApp.toDoItem.duedate">Duedate</label>
          <div class="input-group">
            <input
              id="field_duedate"
              data-cy="duedate"
              type="text"
              class="form-control"
              name="duedate"
              ngbDatepicker
              #duedateDp="ngbDatepicker"
              formControlName="duedate"
            />
            <button type="button" class="btn btn-secondary" (click)="duedateDp.toggle()"><fa-icon icon="calendar-alt"></fa-icon></button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_completetiondate" jhiTranslate="bookshopApp.toDoItem.completetiondate"
            >Completetiondate</label
          >
          <div class="input-group">
            <input
              id="field_completetiondate"
              data-cy="completetiondate"
              type="text"
              class="form-control"
              name="completetiondate"
              ngbDatepicker
              #completetiondateDp="ngbDatepicker"
              formControlName="completetiondate"
            />
            <button type="button" class="btn btn-secondary" (click)="completetiondateDp.toggle()">
              <fa-icon icon="calendar-alt"></fa-icon>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_owner" jhiTranslate="bookshopApp.toDoItem.owner">Owner</label>
          <select class="form-control" id="field_owner" data-cy="owner" name="owner" formControlName="owner" [compareWith]="compareOwner">
            <option [ngValue]="null"></option>
            @for (ownerOption of ownersSharedCollection; track $index) {
              <option [ngValue]="ownerOption">{{ ownerOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_project" jhiTranslate="bookshopApp.toDoItem.project">Project</label>
          <select
            class="form-control"
            id="field_project"
            data-cy="project"
            name="project"
            formControlName="project"
            [compareWith]="compareProject"
          >
            <option [ngValue]="null"></option>
            @for (projectOption of projectsSharedCollection; track $index) {
              <option [ngValue]="projectOption">{{ projectOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_context" jhiTranslate="bookshopApp.toDoItem.context">Context</label>
          <select
            class="form-control"
            id="field_context"
            data-cy="context"
            name="context"
            formControlName="context"
            [compareWith]="compareContext"
          >
            <option [ngValue]="null"></option>
            @for (contextOption of contextsSharedCollection; track $index) {
              <option [ngValue]="contextOption">{{ contextOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_priority" jhiTranslate="bookshopApp.toDoItem.priority">Priority</label>
          <select
            class="form-control"
            id="field_priority"
            data-cy="priority"
            name="priority"
            formControlName="priority"
            [compareWith]="comparePriority"
          >
            <option [ngValue]="null"></option>
            @for (priorityOption of prioritiesSharedCollection; track $index) {
              <option [ngValue]="priorityOption">{{ priorityOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_status" jhiTranslate="bookshopApp.toDoItem.status">Status</label>
          <select
            class="form-control"
            id="field_status"
            data-cy="status"
            name="status"
            formControlName="status"
            [compareWith]="compareStatus"
          >
            <option [ngValue]="null"></option>
            @for (statusOption of statusesSharedCollection; track $index) {
              <option [ngValue]="statusOption">{{ statusOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
