<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (context(); as contextRef) {
      <div>
        <h2 data-cy="contextDetailsHeading"><span jhiTranslate="bookshopApp.context.detail.title">Context</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="bookshopApp.context.id">Id</span></dt>
          <dd>
            <span>{{ contextRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="bookshopApp.context.descrription">Descrription</span></dt>
          <dd>
            <span>{{ contextRef.descrription }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/context', contextRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
